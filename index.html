<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cartilha do Guia | Luck Receptivo</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F8F8;--card:#fff;--ink:#12303A;--mute:#5B7480;--line:#D5E3E6;--sea:#0F6E7A;--sun:#F2B705;--ok:#1E8A5A;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1B20;--card:#142A31;--ink:#E6F1F3;--mute:#9DB6BE;--line:#24424B;--sea:#4FC3D1;--sun:#F2B705;--ok:#5BD39A}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.9rem;font-weight:800;margin:8px 0 4px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 18px}
input[type=search]{width:100%;padding:14px 16px;font:inherit;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
input:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0}
.tab{font:inherit;font-weight:600;padding:14px 10px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;cursor:pointer;text-align:left}
.tab[aria-pressed=true]{background:var(--sea);border-color:var(--sea);color:#fff}
.item{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--sea);border-radius:10px;margin:0 0 10px}
.item summary{padding:14px 16px;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
.item summary::-webkit-details-marker{display:none}
.item summary::after{content:"+";font-weight:400;font-size:1.3rem;line-height:1;color:var(--sea)}
.item[open] summary::after{content:"–"}
.body{padding:0 16px 16px;white-space:pre-line}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{font:inherit;font-weight:600;font-size:.95rem;padding:10px 14px;border-radius:10px;border:2px solid var(--sea);background:transparent;color:var(--sea);cursor:pointer;text-decoration:none;display:inline-block}
.btn.main{background:var(--sun);border-color:var(--sun);color:#12303A}
.btn.done{border-color:var(--ok);color:var(--ok)}
table{width:100%;border-collapse:collapse;margin-top:6px}
td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mute);font-weight:600;font-size:.9rem}
.todo{color:var(--mute);font-style:italic}
.empty{color:var(--mute);padding:20px 0}
.rich{white-space:normal}
.rich p{margin:0 0 10px}.rich ul{margin:4px 0 12px;padding-left:20px}.rich li{margin:3px 0}
.lead{font-size:1.02rem}
.awards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.awards img{width:100%;height:auto;border-radius:12px;background:#fff;display:block}
.difs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:520px){.difs{grid-template-columns:repeat(3,1fr)}}
.dif{border:2px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center;font-size:.9rem;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px}
.dif svg{width:40px;height:40px;fill:none;stroke:var(--sea);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.seg{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.seg h3{margin:0 0 6px;font-size:1.05rem;display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px}
.seg h3 span{background:var(--sun);color:#12303A;border-radius:8px;padding:0 8px;font-size:.9rem}
.k{font-weight:700;margin:8px 0 0!important}
.reps{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.rep{border:2px solid var(--line);border-radius:12px;padding:10px;display:flex;gap:10px;align-items:center}
.rep b{font-size:1.8rem;color:var(--sea);line-height:1}.rep span{font-weight:600;font-size:.92rem}.rep small{display:block;font-weight:400;color:var(--mute)}
.mapwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media (min-width:520px){.mapwrap{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}}
.map{width:100%;max-width:340px;height:auto;display:block;margin:0 auto}
.map .sea{fill:#DCEFF2}.map .land{fill:#F4EBD3;stroke:#C9B98E;stroke-width:1}
.map .st{font-size:10px;font-weight:700;fill:#9A8A62;text-anchor:middle}
.pin{cursor:pointer;outline:none}.pin .hit{fill:transparent}.pin .dot{fill:var(--sea);stroke:#fff;stroke-width:2}
.pin:hover .dot,.pin:focus .dot,.pin.on .dot{fill:#E0412D;r:7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .map .sea{fill:#10313A}:root:not([data-theme="light"]) .map .land{fill:#2A3B33;stroke:#4C6A5C}:root:not([data-theme="light"]) .map .st{fill:#A9C2B5}}
.basecard{border:2px solid var(--sea);border-radius:12px;padding:12px}
.basecard .muted{color:var(--mute);margin:0}
.bt{font-weight:800;font-size:1.1rem;margin:0 0 8px!important}.bt small{display:block;font-weight:400;color:var(--mute);font-size:.85rem}
.bl{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding:8px 0}
.bl span{font-size:.88rem;color:var(--mute)}.bl b{display:block;color:var(--ink);font-size:1rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font:inherit;font-size:.85rem;font-weight:600;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip.on{border-color:var(--sea);background:var(--sea);color:#fff}
footer{color:var(--mute);font-size:.85rem;margin-top:24px}
</style>
</head>

<div id="list"></div>

    {"t": "Seguros: por que são um diferencial?", "html": "<div class=\"seg\"><h3>Seguro Turista <span>R$ 30 mil</span></h3><p>Cobre pequenos imprevistos durante a viagem, como torções, fraturas leves e hematomas, dando mais segurança e tranquilidade ao passageiro durante toda a experiência.</p><p class=\"k\">Para o cliente</p><ul><li>Mais tranquilidade durante a viagem.</li><li>Menos gastos inesperados.</li><li>Economia de tempo para resolver imprevistos.</li></ul><p class=\"k\">Para o agente</p><ul><li>Mais confiança na hora de vender.</li><li>Segurança de trabalhar com uma empresa responsável.</li><li>Uma entrega mais completa para o cliente.</li></ul></div><div class=\"seg\"><h3>Seguro de Responsabilidade Civil <span>R$ 24 milhões</span></h3><p>Mais respaldo para todos. Dá cobertura à Luck caso um imprevisto na operação cause danos a terceiros e reforça a confiança dos parceiros numa operação segura e responsável.</p><ul><li><b>Mais segurança na venda:</b> o agente indica um parceiro com proteção adicional.</li><li><b>Mais confiança para o cliente:</b> mostra que a Luck cuida dos riscos do serviço.</li><li><b>Mais respaldo para a operação:</b> acidentes que causem danos a terceiros contam com a cobertura da apólice.</li><li><b>Mais tranquilidade para a agência:</b> uma operação estruturada fortalece a parceria.</li></ul></div><div class=\"seg\"><h3>Seguro ANTT <span>R$ 5 milhões</span></h3><p>Seguro exigido pela ANTT (Agência Nacional de Transportes Terrestres) para o transporte turístico de passageiros.</p></div>", "s": "seguro turista responsabilidade civil antt 30 mil 24 milhões 5 milhões"},

    {t:"Regras gerais dos passeios", b:"• Saídas com no mínimo 10 passageiros.\n• Saída do hotel no início da manhã e retorno no fim da tarde. Os horários seguem a sequência de hotéis e podem ter atrasos ou antecipações.\n• O cliente deve estar na recepção do hotel 5 minutos antes do horário marcado. Quem não estiver na recepção no horário não tem direito a reembolso.\n• Documento com foto obrigatório (certidão de nascimento para menores).\n• Não incluso: refeições, day use e entradas em igrejas, conventos, fortes, museus, sinagogas, parques e espetáculos.\n• A Luck não se responsabiliza por passeios de terceiros não incluídos (jangada, barco, buggy, tirolesa, jet-ski, mergulho etc.) nem por objetos esquecidos nos veículos.\n• Veículos com ar-condicionado e guia de turismo.\n• Piscinas naturais de Porto de Galinhas e Galés de Maragogi dependem de maré baixa e disponibilidade. Consultar antes de vender."},
